name: publish image

# runs when you push a tag like v1.1.0
# pushes to docker hub (youcxf/localfill) and ghcr.io
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io only accepts lowercase image names
      - name: lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # qemu lets us build the arm64 image (raspberry pi, apple silicon) on a normal runner
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repo secrets
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.1.0 becomes the tags 1.1.0, 1.1, 1 and latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            youcxf/localfill
            ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
